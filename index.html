<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQI Signage - High Visibility Vivid</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #F3F3F3;
            overflow: hidden;
            position: relative;
        }

        #bottom-bar {
            width: 100%;
            height: 65%;
            position: absolute;
            top: 35%;
            left: 0;
            background: #95a5a6;
            -webkit-transition: background 0.8s ease-in-out;
            transition: background 0.8s ease-in-out;
            z-index: 1;
        }

        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        .header-text {
            position: absolute;
            width: 100%;
            top: 3vh;
            text-align: center;
            color: black;
            font-size: 13vh;
            font-weight: 700;
        }

        .main-card {
            width: 86%;
            height: 42vh;
            left: 7%;
            top: 27vh;
            position: absolute;
            background: white;
            border-radius: 9vh;
            z-index: 20;
            -webkit-box-shadow: 0px 4px 100px rgba(0, 0, 0, 0.25);
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
        }

        .aqi-section {
            -webkit-flex: 2;
            flex: 2;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            padding-left: 2vh;
        }

        .aqi-row {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
        }

        .aqi-scale {
            position: relative;
            width: 80vh;
            margin-top: 2vh;
            padding-bottom: 3.5vh;
        }

        .scale-bar {
            display: -webkit-flex;
            display: flex;
            height: 1.8vh;
        }

        .scale-seg {
            -webkit-flex: 1;
            flex: 1;
            margin-left: 0.6vh;
        }

        .scale-seg:first-child {
            margin-left: 0;
            border-radius: 1vh 0 0 1vh;
        }

        .scale-seg:last-child {
            border-radius: 0 1vh 1vh 0;
        }

        .scale-tick {
            position: absolute;
            top: 3vh;
            font-size: 2.2vh;
            line-height: 1;
            color: #7a8a92;
            -webkit-transform: translateX(-50%);
            transform: translateX(-50%);
        }

        .scale-marker {
            position: absolute;
            top: -0.9vh;
            width: 0.9vh;
            height: 3.6vh;
            margin-left: -0.45vh;
            border-radius: 0.45vh;
            background: #17394a;
            border: 0.25vh solid white;
            -webkit-box-sizing: content-box;
            box-sizing: content-box;
            left: 0;
            transition: left 0.8s ease-in-out;
        }

        #status-icon {
            width: 19vh;
            height: 19vh;
            margin-right: 5vh;
            -webkit-animation: floating 1.5s ease-in-out infinite;
        }

        #aqi-value {
            font-size: 24vh;
            font-weight: 700;
            color: #95a5a6;
            line-height: 1;
            transition: color 0.8s;
        }

        .aqi-label {
            font-size: 3.5vh;
            font-weight: 700;
            color: #95a5a6;
            margin-top: -1vh;
            text-align: center;
            transition: color 0.8s;
        }

        .divider {
            width: 5px;
            height: 30vh;
            background: #95a5a6;
            opacity: 0.5;
            transition: background 0.8s;
        }

        .temp-section {
            -webkit-flex: 1;
            flex: 1;
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
        }

        #weather-icon-box {
            width: 8vh;
            height: 20vh;
            margin-right: 5vh;
            display: block;
            overflow: visible;
        }

        #temp-value {
            font-size: 10vh;
            font-weight: 700;
            color: #95a5a6;
            transition: color 0.8s;
        }

        #status-text-large {
            position: absolute;
            width: 100%;
            top: 72vh;
            text-align: center;
            color: white;
            font-size: 13vh;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            padding: 0 5%;
        }

        .footer-info {
            position: absolute;
            width: 100%;
            bottom: 3vh;
            text-align: center;
            color: white;
            font-size: 3.5vh;
            font-weight: 400;
        }

        @-webkit-keyframes floating {
            0% {
                -webkit-transform: translateY(0px);
            }

            50% {
                -webkit-transform: translateY(-20px);
            }

            100% {
                -webkit-transform: translateY(0px);
            }
        }
    </style>
</head>

<body>

    <div id="bottom-bar"></div>

    <div class="screen-container">
        <div class="header-text">คุณภาพอากาศวันนี้</div>

        <div class="main-card">
            <div class="aqi-section">
                <div class="aqi-row">
                    <div id="status-icon"></div>
                    <div>
                        <div id="aqi-value">--</div>
                        <div class="aqi-label">AQI</div>
                    </div>
                </div>
                <div class="aqi-scale" id="aqi-scale"></div>
            </div>

            <div id="mid-line" class="divider"></div>

            <div class="temp-section">
                <div id="weather-icon-box"></div>
                <div id="temp-value">--°C</div>
            </div>
        </div>

        <div id="status-text-large">กำลังเชื่อมต่อ...</div>

        <div class="footer-info">
            <span id="station-name">ACAIR CMU</span> | <span id="current-time">อัปเดตล่าสุด --:--</span>
        </div>
    </div>

    <!-- fetch_weather.py เขียนค่าล่าสุดจาก API ของ CMU ลงตรงนี้ทุกชั่วโมง (อย่าแก้มือ) -->
    <script id="embedded-data" type="application/json">/*EMBED_START*/{"timestamp": "18/11/2026 16:00:00", "aqi": 25.0, "temp": 29.56}/*EMBED_END*/</script>

    <script>
        // ดึงค่าสดจาก API ของ CMU ลองตามลำดับ ถ้าไม่ได้จะใช้ค่าที่ฝังไว้ในไฟล์
        // API ของ CMU ไม่เปิด CORS เบราว์เซอร์เรียกตรงไม่ได้ จึงมี CORS proxy สาธารณะเป็นตัวสำรอง
        // (ฟรี ไม่รับประกันว่าจะใช้ได้ตลอด ถ้าตัวไหนเลิกให้บริการจะข้ามไปตัวถัดไปเอง)
        var API_URL = 'https://dashboard.acair.cmu.ac.th/api/data?reslution=';
        var API_ENC = encodeURIComponent(API_URL);
        var DATA_SOURCES = [
            { url: API_URL, parse: JSON.parse },
            { url: 'https://api.allorigins.win/raw?url=' + API_ENC, parse: JSON.parse },
            { url: 'https://api.allorigins.win/get?url=' + API_ENC, parse: function (t) { return JSON.parse(JSON.parse(t).contents); } },
            { url: 'https://r.jina.ai/' + API_URL, parse: function (t) { return JSON.parse(t.slice(t.indexOf('{', t.indexOf('Markdown Content:')))); } }
        ];
        var CACHE_KEY = 'aqi-cache';
        var CACHE_TTL = 10 * 60 * 1000;  // เช็คค่าใหม่ทุก 10 นาที
        var RETRY_MS = 60 * 1000;        // ดึงไม่สำเร็จ ลองใหม่ทุก 1 นาที

        function getThermometerIcon(color) {
            return '<svg viewBox="0 0 100 100" style="width:100%; height:100%; overflow:visible;">' +
                '<path d="M50 20 A10 10 0 0 1 60 30 V70 A20 20 0 1 1 40 70 V30 A10 10 0 0 1 50 20 Z" fill="none" stroke="' + color + '" stroke-width="6"/>' +
                '<circle cx="50" cy="80" r="8" fill="' + color + '"/>' +
                '<rect x="47" y="40" width="6" height="35" rx="3" fill="' + color + '"/>' +
                '</svg>';
        }

        function getAqiIcon(color, type) {
            var mouth = (type === 'happy') ? "M30 70 Q50 85 70 70" : "M30 80 Q50 65 70 80";
            return '<svg viewBox="0 0 100 100" style="width:100%; height:100%;"><circle cx="50" cy="50" r="48" fill="' + color + '" /><circle cx="33" cy="40" r="6" fill="white" /><circle cx="67" cy="40" r="6" fill="white" /><path d="' + mouth + '" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" /></svg>';
        }

        // timestamp จาก API รูปแบบ "dd/mm/yyyy HH:MM:SS" (เวลาไทย) -> "อัปเดตล่าสุด dd/mm/yyyy HH:MM น."
        function showUpdateTime(ts) {
            var m = /^(\d\d)\/(\d\d)\/(\d{4}) (\d\d:\d\d)/.exec(ts || '');
            if (!m) return;
            document.getElementById('current-time').innerText =
                'อัปเดตล่าสุด ' + m[1] + '/' + m[2] + '/' + m[3] + ' ' + m[4] + ' น.';
        }

        function readCache() {
            try {
                var c = JSON.parse(localStorage.getItem(CACHE_KEY));
                if (c && typeof c.t === 'number' && c.d) return c;
            } catch (e) { }
            return null;
        }

        function writeCache(d) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: d })); } catch (e) { }
        }

        // done(ok) ถูกเรียกเมื่อดึงสำเร็จ หรือลองครบทุก URL แล้วไม่สำเร็จ
        function fetchAirData(i, done) {
            i = i || 0;
            if (i >= DATA_SOURCES.length) { if (done) done(false); return; }
            var xhr = new XMLHttpRequest();
            xhr.open('GET', DATA_SOURCES[i].url, true);
            xhr.timeout = 15000;
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;
                try {
                    if (xhr.status !== 200) throw new Error('HTTP ' + xhr.status);
                    var r = DATA_SOURCES[i].parse(xhr.responseText);
                    if (r.status !== 'success') throw new Error('API status ' + r.status);
                    renderUI(Number(r.data.aqi), Number(r.data.temp), r.data.timestamp);
                    writeCache({ aqi: r.data.aqi, temp: r.data.temp, timestamp: r.data.timestamp });
                    if (done) done(true);
                } catch (e) {
                    console.error(DATA_SOURCES[i].url, e);
                    fetchAirData(i + 1, done);
                }
            };
            xhr.send();
        }

        // สีของอุณหภูมิ (°C) แยกจากสีของ AQI
        function getTempColor(t) {
            if (isNaN(t)) return "#95a5a6";
            if (t < 20) return "#2D8CFF";   // เย็น
            if (t < 28) return "#00B050";   // สบาย
            if (t < 33) return "#F29900";   // อุ่น/ร้อน
            if (t < 38) return "#FF5A00";   // ร้อนมาก
            return "#E00000";               // ร้อนจัด
        }

        // ชุดสี AQI 6 ระดับ สำหรับจอ Signage (max = ขอบบนของระดับ, ใช้เป็นตัวเลขบนแถบสเกลด้วย)
        var AQI_LEVELS = [
            { max: 50,  color: "#20C982", text: "อากาศดี", type: 'happy', textOnColor: "white" },
            { max: 100, color: "#F5C842", text: "อากาศปานกลาง", type: 'happy', textOnColor: "black" },
            { max: 150, color: "#F08B3E", text: "เริ่มมีผลต่อกลุ่มเสี่ยง", type: 'sad', textOnColor: "white" },
            { max: 200, color: "#EE4D5A", text: "มีผลต่อสุขภาพ", type: 'sad', textOnColor: "white" },
            { max: 300, color: "#9561D1", text: "มีผลต่อสุขภาพอย่างมาก", type: 'sad', textOnColor: "white" },
            { max: 500, color: "#8F3D58", text: "อันตราย", type: 'sad', textOnColor: "white" }
        ];

        function getAqiLevelIndex(aqi) {
            for (var i = 0; i < AQI_LEVELS.length - 1; i++) {
                if (aqi <= AQI_LEVELS[i].max) return i;
            }
            return AQI_LEVELS.length - 1;
        }

        // แถบสเกลทุกช่วงกว้างเท่ากัน ตำแหน่งตัวชี้คิดแบบเส้นตรงภายในแต่ละช่วง
        function buildAqiScale() {
            var scale = document.getElementById('aqi-scale');
            var n = AQI_LEVELS.length;
            var html = '<div class="scale-bar">';
            for (var i = 0; i < n; i++) {
                html += '<div class="scale-seg" style="background:' + AQI_LEVELS[i].color + '"></div>';
            }
            html += '</div>';
            for (var j = 0; j <= n; j++) {
                var label = (j === 0) ? 0 : AQI_LEVELS[j - 1].max;
                var align = (j === 0) ? 'transform:none;' : (j === n) ? 'transform:translateX(-100%);' : '';
                html += '<div class="scale-tick" style="left:' + (j / n * 100) + '%;' + align + '">' + label + '</div>';
            }
            html += '<div class="scale-marker" id="scale-marker"></div>';
            scale.innerHTML = html;
        }

        function updateAqiMarker(aqi) {
            var i = getAqiLevelIndex(aqi);
            var lo = i === 0 ? 0 : AQI_LEVELS[i - 1].max;
            var frac = Math.min(Math.max((aqi - lo) / (AQI_LEVELS[i].max - lo), 0), 1);
            document.getElementById('scale-marker').style.left = ((i + frac) / AQI_LEVELS.length * 100) + '%';
        }

        function renderUI(aqi, temp, ts) {
            if (isNaN(aqi)) return;
            showUpdateTime(ts);
            var level = AQI_LEVELS[getAqiLevelIndex(aqi)];
            var color = level.color, text = level.text, type = level.type, textOnColor = level.textOnColor;
            updateAqiMarker(aqi);

            // อัปเดต UI
            const aqiVal = document.getElementById('aqi-value');
            const tempVal = document.getElementById('temp-value');
            const statusTxt = document.getElementById('status-text-large');
            const labelTxt = document.querySelector('.aqi-label');

            aqiVal.innerText = aqi;
            // สำหรับสีเหลืองปรับสีตัวหนังสือให้เข้มเพื่อ Contrast
            aqiVal.style.color = (color === "#F5C842") ? "#B8860B" : color;
            tempVal.innerText = isNaN(temp) ? "--°C" : temp.toFixed(1) + "°C";
            var tempColor = getTempColor(temp);
            tempVal.style.color = tempColor;

            document.getElementById('bottom-bar').style.background = color;

            statusTxt.innerText = text;
            statusTxt.style.color = textOnColor;

            document.getElementById('status-icon').innerHTML = getAqiIcon(color, type);
            document.getElementById('weather-icon-box').innerHTML = getThermometerIcon(tempColor);
            if (labelTxt) labelTxt.style.color = (color === "#F5C842") ? "#B8860B" : color;
        }

        // แสดงค่าที่ฝังในไฟล์ทันที (ใช้ได้แม้เปิดแบบ file://) แล้วค่อยลองดึงค่าสดทับ
        function loadEmbedded() {
            try {
                var txt = document.getElementById('embedded-data').textContent.replace(/\/\*[A-Z_]+\*\//g, '');
                var d = JSON.parse(txt);
                renderUI(Number(d.aqi), Number(d.temp), d.timestamp);
            } catch (e) { console.error("Embedded data error:", e); }
        }

        // แคชใน localStorage อายุ 10 นาที: ถ้ายังสดใช้ค่าในแคชเลย ไม่ยิง API แล้วนัดเช็คใหม่ตอนแคชหมดอายุ
        function refresh() {
            var c = readCache(), age = c ? Date.now() - c.t : Infinity;
            if (age >= 0 && age < CACHE_TTL) {
                renderUI(Number(c.d.aqi), Number(c.d.temp), c.d.timestamp);
                setTimeout(refresh, CACHE_TTL - age + 1000);
            } else {
                fetchAirData(0, function (ok) { setTimeout(refresh, ok ? CACHE_TTL : RETRY_MS); });
            }
        }

        buildAqiScale();
        loadEmbedded();
        refresh();
        // โหลดหน้าใหม่ทุกชั่วโมงเพื่อรับโค้ดใหม่และค่าที่ GitHub Actions ฝังลงไฟล์ (?t= กันแคช)
        setInterval(function () { location.replace(location.pathname + '?t=' + Date.now()); }, 3600000);
    </script>
</body>

</html>
